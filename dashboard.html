<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sentinela Acadêmica | Visão Geral</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <link rel="stylesheet" href="ui.css">
    <link rel="icon" href="logo.svg" type="image/svg+xml">
</head>

<body>

<div class="dashboard">

    <!-- Sidebar -->

    <aside class="sidebar" id="sidebar"></aside>

    <!-- Conteúdo -->

    <main class="content">

        <header class="top-bar">

            <div>
                <h1>Visão Geral</h1>
                <p>Acompanhe os indicadores da escola.</p>
            </div>

            <div class="avatar-coord"><i class="fa-solid fa-user-shield"></i></div>

        </header>

        <!-- Cards -->

        <section class="cards" id="cardsResumo"></section>

        <!-- Conteúdo inferior -->

        <section class="dashboard-grid">

            <div class="chart-card">

                <h2>Evolução dos Indicadores</h2>
                <canvas id="grafico"></canvas>

            </div>

            <div class="alert-card">

                <h2>Alunos em Alta Necessidade</h2>
                <ul id="listaAtencao"></ul>

            </div>

        </section>

        <!-- Sistema de Gráficos Detalhados -->

        <section class="chart-card" style="margin-top:24px;">
            <h2><i class="fa-solid fa-chart-pie"></i> Gráficos Detalhados</h2>
            <p style="color:#64748b;margin-bottom:16px;">Selecione um gráfico para visualizar e, se desejar, compare com outro.</p>

            <div class="chart-selector">
                <div class="selector-group">
                    <label>Gráfico Principal</label>
                    <select id="graficoPrincipal">
                        <option value="alunosTurma">Alunos por Turma</option>
                        <option value="frequencia">Distribuição de Frequência</option>
                        <option value="notasBaixas">Notas Baixas vs Boas Notas</option>
                        <option value="matriculados">Alunos Matriculados</option>
                        <option value="pendencias">Pendências por Turma</option>
                        <option value="desempenhoDisciplina">Desempenho por Disciplina</option>
                        <option value="evolucaoIPA">Evolução IPA vs Média</option>
                    </select>
                </div>
                <div class="selector-group">
                    <label>Comparar com (opcional)</label>
                    <select id="graficoComparacao">
                        <option value="">— Nenhum —</option>
                        <option value="alunosTurma">Alunos por Turma</option>
                        <option value="frequencia">Distribuição de Frequência</option>
                        <option value="notasBaixas">Notas Baixas vs Boas Notas</option>
                        <option value="matriculados">Alunos Matriculados</option>
                        <option value="pendencias">Pendências por Turma</option>
                        <option value="desempenhoDisciplina">Desempenho por Disciplina</option>
                        <option value="evolucaoIPA">Evolução IPA vs Média</option>
                    </select>
                </div>
            </div>

            <div class="chart-compare-grid" id="chartCompareGrid">
                <div class="chart-box">
                    <h3 id="tituloPrincipal">Alunos por Turma</h3>
                    <canvas id="canvasPrincipal"></canvas>
                </div>
                <div class="chart-box" id="boxComparacao" style="display:none;">
                    <h3 id="tituloComparacao">Comparação</h3>
                    <canvas id="canvasComparacao"></canvas>
                </div>
            </div>
        </section>

    </main>

</div>

<script src="dados.js"></script>
<script src="preferencias.js"></script>
<script src="app.js"></script>
<script src="dashboard.js"></script>

</body>

</html>
